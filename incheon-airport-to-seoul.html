    const COPY={
      en:{back:'← Home',kicker:'INCHEON AIRPORT · T1 & T2',title:'Find the right curb, before you leave arrivals.',lead:'A terminal-by-terminal orientation guide for airport taxis, Seoul and regional buses, and AREX airport rail.',heroNote:'Gate and route areas are based on Incheon Airport guidance. Bus timetables change, so open the official route search before boarding.',seqTitle:'Your arrival sequence',seq:['Confirm whether your flight arrives at <strong>T1</strong> or <strong>T2</strong>.','Use the correct floor and exit zone for taxi, bus or rail.','Check the live official bus route before you queue.'],quickTitle:'Quick answer',quick:'AREX is in the <b>Transportation Center B1</b> at both terminals. For buses, T1 uses curbside exit zones on <b>1F</b>, while T2 uses the <b>B1 Transportation Center</b> for Seoul, Gyeonggi and regional buses. Taxis use <b>1F</b> at both terminals.',terminalKicker:'TERMINAL ORIENTATION',terminalTitle:'Pick your arrival terminal',terminalCopy:'The images below are illustrative wayfinding scenes. The location labels and gate ranges are the part to follow; they link to Incheon Airport’s current official guidance.',tabs:['Terminal 1 · T1','Terminal 2 · T2'],imageLabel:'Illustrative orientation image · check gate labels below',t1Title:'T1: arrivals to ground transport',t1Text:'After arrivals, use <strong>1F</strong> for taxi and bus curb zones. Go down to the <strong>Transportation Center B1</strong> for AREX.',t1Link:'Open official T1 bus guide ↗',t2Title:'T2: traffic center routes',t2Text:'Use <strong>1F</strong> for taxis. Seoul, Gyeonggi and regional buses depart from the <strong>Transportation Center B1</strong>; AREX is also on B1.',t2Link:'Open official T2 bus guide ↗',mode:['Taxi','Airport bus','AREX rail'],t1Mode:['1F taxi stands|Seoul 5C·6C·6D','1F outside exits|Seoul: exits 3–7','Transportation Center|B1 · all-stop / express'],t2Mode:['1F taxi stands|Seoul 7C','Transportation Center|B1 · Seoul 11–35','Transportation Center|B1 · all-stop / express'],gateKicker:'BUS GATE ZONES',gateTitle:'Which gate area should you walk to?',gateCopy:'These are terminal-level location zones. Find your city in the official bus search immediately before travel, then confirm the exact bay on airport screens or with staff.',gate1:'Terminal 1 · curbside on 1F',gate1Text:'Walk outside after arrivals. Ticket offices are near exits 4 and 9 inside, and several curbside exits.',gate2:'Terminal 2 · Transportation Center B1',gate2Text:'For Seoul, Gyeonggi and regional routes, go down to B1. Ticketing and bus information are in the traffic center.',gateRows:[['Seoul buses','Outside exits 3–7'],['Gyeonggi buses','Outside exits 7–10'],['Regional / provincial','Outside exits 11–13'],['Incheon buses','Outside exits 2–3 and 13–14']],gateRows2:[['Seoul buses','Central bays 11–35'],['Gyeonggi buses','East bays 36–45'],['Regional / provincial','West bays 1–10'],['Incheon buses','1F outside exits 1 and 6']],arexKicker:'AREX AIRPORT RAIL',arexTitle:'Both terminals: take the signs to Transportation Center B1.',arexText:'AREX connects T2 to T1 in about 6 minutes and continues to key Seoul transfer stations. Choose all-stop or express after checking your destination and the current timetable.',arexLink:'Open official AREX location and line guide ↗',cityKicker:'CITY & REGIONAL BUS FINDER',cityTitle:'Seoul and major regional destinations',cityCopy:'Use these as orientation examples, not timetables. Each card sends you to Incheon Airport’s official live route search, where you can confirm the day’s terminal, bay, operator and schedule.',cities:[['Seoul center','Examples: 6005 City Hall · 6015 Myeongdong · 6701 Gwanghwamun · 6703 COEX','Search Seoul routes ↗'],['Daejeon','Check Daejeon Complex, Yuseong or Government Complex.','Search Daejeon ↗'],['Busan · Gimhae','Long-distance service; check final stop and reservation channel.','Search Busan / Gimhae ↗'],['Daegu','Search Dongdaegu and confirm the bay on the day.','Search Daegu ↗'],['Gwangju · Jeonju','Search Gwangju U-Square or Jeonju for current service.','Search Gwangju / Jeonju ↗'],['Gangneung','Long-distance service can change with season and road conditions.','Search Gangneung ↗']],notice:'<strong>Before you buy a ticket:</strong> allow 1–2 hours for arrivals and immigration, then confirm the exact terminal, final stop, departure bay and time in the official airport route search. Do not rely on an old screenshot for the final decision.',refs:'Official sources used in this guide.',footer:'<strong>KOREA EASY</strong> · Korea, Made Easy.<br>Always confirm current fares, route availability and operating information before travel.'},
      ja:{back:'← ホーム',kicker:'仁川空港 · T1 & T2',title:'到着ロビーを出る前に、正しい乗り場を確認。',lead:'空港タクシー、ソウル・地方行きバス、AREX空港鉄道をターミナル別に案内します。',heroNote:'ゲート・路線エリアは仁川空港の案内に基づいています。時刻表は変わるため、乗車前に必ず公式路線検索を開いてください。',seqTitle:'到着後の流れ',seq:['到着ターミナルが<strong>T1</strong>か<strong>T2</strong>かを確認します。','タクシー・バス・鉄道に合った階と出口エリアへ向かいます。','列に並ぶ前に、公式の最新バス路線を確認します。'],quickTitle:'すぐに確認',quick:'AREXは両ターミナルとも<b>交通センターB1</b>にあります。バスはT1では<b>1階</b>の出口エリア、T2ではソウル・京畿・地方行きが<b>B1交通センター</b>から出発します。タクシーは両ターミナルとも<b>1階</b>です。',terminalKicker:'ターミナル案内',terminalTitle:'到着ターミナルを選択',terminalCopy:'下の画像は方向案内のイメージです。実際に確認するのは位置ラベルとゲート範囲で、仁川空港公式案内へ直接リンクしています。',tabs:['第1ターミナル · T1','第2ターミナル · T2'],imageLabel:'案内イメージ · 下のゲート表示を確認',t1Title:'T1：到着ロビーから地上交通へ',t1Text:'到着後、タクシーとバスは<strong>1階</strong>の乗り場へ。AREXは<strong>交通センターB1</strong>へ下ります。',t1Link:'T1公式バス案内を開く ↗',t2Title:'T2：交通センターの路線',t2Text:'タクシーは<strong>1階</strong>へ。ソウル・京畿・地方行きバスとAREXは<strong>交通センターB1</strong>から出発します。',t2Link:'T2公式バス案内を開く ↗',mode:['タクシー','空港バス','AREX鉄道'],t1Mode:['1階タクシー乗り場|ソウル 5C・6C・6D','1階・出口の外側|ソウル：出口3～7','交通センター|B1 · 各駅 / 直通'],t2Mode:['1階タクシー乗り場|ソウル 7C','交通センター|B1 · ソウル 11～35','交通センター|B1 · 各駅 / 直通'],gateKicker:'バス乗り場エリア',gateTitle:'どのゲートエリアへ向かう？',gateCopy:'これはターミナル単位の位置エリアです。出発直前に公式バス検索で都市を探し、空港の案内表示またはスタッフに正確な乗り場を確認してください。',gate1:'第1ターミナル · 1階の車道側',gate1Text:'到着後に外へ出ます。チケット売り場は館内の出口4・9付近と複数の車道側出口にあります。',gate2:'第2ターミナル · 交通センターB1',gate2Text:'ソウル・京畿・地方行きはB1へ下ります。チケットとバス案内は交通センター内にあります。',gateRows:[['ソウル行き','出口3～7の外側'],['京畿行き','出口7～10の外側'],['地方行き','出口11～13の外側'],['仁川市内行き','出口2～3・13～14の外側']],gateRows2:[['ソウル行き','中央乗り場 11～35'],['京畿行き','東側乗り場 36～45'],['地方行き','西側乗り場 1～10'],['仁川市内行き','1階・出口1・6の外側']],arexKicker:'AREX 空港鉄道',arexTitle:'両ターミナルとも交通センターB1の案内に従います。',arexText:'AREXはT2からT1まで約6分で結び、ソウルの主要乗換駅へ続きます。目的地と当日の時刻表を確認して各駅停車または直通を選んでください。',arexLink:'AREX公式位置・路線案内を開く ↗',cityKicker:'都市・地方行きバス検索',cityTitle:'ソウルと主要地方都市',cityCopy:'以下は方向確認用の例であり、時刻表ではありません。各カードから仁川空港公式の最新路線検索を開き、当日のターミナル・乗り場・運行会社・時刻を確認してください。',cities:[['ソウル中心部','例：6005 市庁 · 6015 明洞 · 6701 光化門 · 6703 COEX','ソウル路線を検索 ↗'],['大田','大田複合・儒城・政府庁舎を検索してください。','大田を検索 ↗'],['釜山・金海','長距離路線です。最終停留所と予約方法を確認してください。','釜山 / 金海を検索 ↗'],['大邱','東大邱を検索し、当日の乗り場を確認してください。','大邱を検索 ↗'],['光州・全州','光州Uスクエアまたは全州の最新運行を検索してください。','光州 / 全州を検索 ↗'],['江陵','季節や道路状況で長距離便が変わることがあります。','江陵を検索 ↗']],notice:'<strong>チケット購入前に：</strong>到着・入国手続きに1～2時間を見込み、公式路線検索で正確なターミナル・最終停留所・乗り場・時刻を確認してください。古いスクリーンショットだけで最終判断をしないでください。',refs:'このガイドで使用した公式情報源。',footer:'<strong>KOREA EASY</strong> · Korea, Made Easy.<br>運賃、運行可否、運行情報は旅行前に必ず最新の公式情報を確認してください。'},
      zh:{back:'← 首页',kicker:'仁川机场 · T1 & T2',title:'离开到达层前，先找到正确乘车区。',lead:'按航站楼说明机场出租车、首尔及地方巴士与 AREX 机场铁路。',heroNote:'登车区与路线范围基于仁川机场指引。巴士时刻可能变动，上车前请打开官方路线查询。',seqTitle:'抵达后的步骤',seq:['确认航班到达<strong>T1</strong>还是<strong>T2</strong>。','前往出租车、巴士或铁路对应的楼层和出口区域。','排队前先查询官方实时巴士路线。'],quickTitle:'快速答案',quick:'两个航站楼的AREX都在<b>交通中心B1</b>。巴士方面，T1在<b>1层</b>出口外侧乘车；T2的首尔、京畿和地方巴士从<b>B1交通中心</b>出发。两个航站楼的出租车都在<b>1层</b>。',terminalKicker:'航站楼导向',terminalTitle:'选择抵达航站楼',terminalCopy:'下方图片为导向示意图。请以位置标签和登车区范围为准；它们链接至仁川机场的最新官方指引。',tabs:['1号航站楼 · T1','2号航站楼 · T2'],imageLabel:'导向示意图 · 请确认下方登车区标签',t1Title:'T1：从到达层前往地面交通',t1Text:'抵达后，出租车和巴士请前往<strong>1层</strong>乘车区；AREX请下到<strong>交通中心B1</strong>。',t1Link:'打开T1官方巴士指南 ↗',t2Title:'T2：交通中心路线',t2Text:'出租车在<strong>1层</strong>；首尔、京畿和地方巴士以及AREX均从<strong>交通中心B1</strong>出发。',t2Link:'打开T2官方巴士指南 ↗',mode:['出租车','机场巴士','AREX铁路'],t1Mode:['1层出租车站|首尔 5C·6C·6D','1层出口外侧|首尔：出口3–7','交通中心|B1 · 普通 / 直达'],t2Mode:['1层出租车站|首尔 7C','交通中心|B1 · 首尔 11–35','交通中心|B1 · 普通 / 直达'],gateKicker:'巴士登车区',gateTitle:'应该走到哪个出口区域？',gateCopy:'这是按航站楼划分的位置区域。出发前请在官方巴士查询中搜索城市，并在机场屏幕或向工作人员确认准确登车位。',gate1:'1号航站楼 · 1层路边',gate1Text:'抵达后向外走。售票处位于室内出口4、9附近以及多个路边出口旁。',gate2:'2号航站楼 · 交通中心B1',gate2Text:'首尔、京畿和地方路线请下到B1。售票与巴士咨询处位于交通中心内。',gateRows:[['首尔巴士','出口3–7外侧'],['京畿巴士','出口7–10外侧'],['地方巴士','出口11–13外侧'],['仁川市内巴士','出口2–3及13–14外侧']],gateRows2:[['首尔巴士','中央站台 11–35'],['京畿巴士','东侧站台 36–45'],['地方巴士','西侧站台 1–10'],['仁川市内巴士','1层出口1和6外侧']],arexKicker:'AREX 机场铁路',arexTitle:'两个航站楼都请按指示前往交通中心B1。',arexText:'AREX约6分钟连接T2与T1，并继续前往首尔主要换乘站。请在确认目的地与当天时刻表后选择普通列车或直达列车。',arexLink:'打开AREX官方位置与线路指南 ↗',cityKicker:'城市与地方巴士查询',cityTitle:'首尔及主要地方城市',cityCopy:'这些仅为方位示例，并非时刻表。每张卡片都会打开仁川机场官方实时路线查询，您可确认当天的航站楼、登车位、运营商与时刻。',cities:[['首尔市中心','示例：6005 市厅 · 6015 明洞 · 6701 光化门 · 6703 COEX','查询首尔路线 ↗'],['大田','请查询大田综合、儒城或政府大楼。','查询大田 ↗'],['釜山 · 金海','长途服务；请确认终点站和预订方式。','查询釜山 / 金海 ↗'],['大邱','请查询东大邱，并当天确认站台。','查询大邱 ↗'],['光州 · 全州','请查询光州U-Square或全州的当前服务。','查询光州 / 全州 ↗'],['江陵','长途服务会随季节和道路情况变化。','查询江陵 ↗']],notice:'<strong>购票前：</strong>请预留1–2小时完成抵达和入境手续，然后在官方路线查询中确认准确的航站楼、终点、登车位和时间。不要仅凭旧截图作最终决定。',refs:'本指南使用的官方信息来源。',footer:'<strong>KOREA EASY</strong> · Korea, Made Easy.<br>出行前请始终确认最新票价、路线可用性和运营信息。'}
    };
    Object.assign(COPY.en,{rentalKicker:'RENTAL CAR DESK',rentalTitle:'Confirm your pick-up counter before you reserve.',rentalCopy:'At T1, rental counters are between exits 13 and 14 on the 1F public area. At T2, they are on the west side of the Transportation Center B1. Confirm operating hours and reservation conditions with your provider before travel.',rentalT1:'T1 · 1F public area',rentalT1Detail:'Between exits 13 and 14',rentalT2:'T2 · Transportation Center B1',rentalT2Detail:'West side of the transportation center',rentalLink:'Open official car-rental locations ↗',rentalNote:'The airport lists SK and Lotte rental desks. Availability, licence conditions and booking policies must be confirmed with the provider.'});
    Object.assign(COPY.ja,{rentalKicker:'レンタカー案内',rentalTitle:'予約前に受取カウンターを確認。',rentalCopy:'T1のレンタカーカウンターは一般エリア1階・出口13と14の間です。T2は交通センターB1の西側です。営業時間と予約条件は旅行前に各社へ確認してください。',rentalT1:'T1 · 1階 一般エリア',rentalT1Detail:'出口13と14の間',rentalT2:'T2 · 交通センターB1',rentalT2Detail:'交通センター西側',rentalLink:'公式レンタカー案内を開く ↗',rentalNote:'空港案内にはSK・ロッテのレンタカーカウンターが記載されています。空き状況、免許条件、予約規約は各社で確認してください。'});
    Object.assign(COPY.zh,{rentalKicker:'租车柜台',rentalTitle:'预订前先确认取车柜台。',rentalCopy:'T1租车柜台位于公共区域1层13号与14号出口之间。T2柜台位于交通中心B1西侧。出行前请向租车公司确认营业时间与预订条件。',rentalT1:'T1 · 1层公共区域',rentalT1Detail:'13号与14号出口之间',rentalT2:'T2 · 交通中心B1',rentalT2Detail:'交通中心西侧',rentalLink:'打开官方租车地点指南 ↗',rentalNote:'机场指南列出SK和乐天租车柜台。车辆供应、驾照条件和预订政策请向租车公司确认。'});
    let lang=localStorage.getItem('incheonGuideLang')||'en';
    const requestedTerminal=new URLSearchParams(location.search).get('terminal');
    let activeTerminal=requestedTerminal==='t2'?'t2':'t1';
    const token=['S','G','R','I'];
    function modeCard(symbol,name,details){const [place,location]=details.split('|');return `<div class="mode"><b class="mode-symbol">${symbol}</b><strong>${name}</strong><span>${place}</span><em class="location">${location}</em></div>`}
    function gateRows(rows){return rows.map((row,index)=>`<div class="gate-row"><b class="gate-token">${token[index]}</b><div><strong>${row[0]}</strong><span>${row[1]}</span></div></div>`).join('')}
    function terminalPanel(id,t){const t1=id==='t1',photo=t1?'assets/incheon-t1-arrivals-taxi-wayfinding.webp':'assets/incheon-t2-transport-center-wayfinding.webp',title=t1?t.t1Title:t.t2Title,text=t1?t.t1Text:t.t2Text,link=t1?t.t1Link:t.t2Link,modes=t1?t.t1Mode:t.t2Mode,guide=t1?OFFICIAL.t1:OFFICIAL.t2;return `<section class="terminal-panel ${activeTerminal===id?'active':''}" id="${id}" role="tabpanel"><div class="terminal-layout"><div class="terminal-photo"><img src="${photo}" alt="${t.imageLabel}"><span class="image-label">${t.imageLabel}</span></div><div class="terminal-summary"><h3>${title}</h3><p>${text}</p><a class="source-link" href="${guide}" target="_blank" rel="noopener noreferrer">${link}</a><div class="mode-grid">${modeCard('T',t.mode[0],modes[0])}${modeCard('B',t.mode[1],modes[1])}${modeCard('R',t.mode[2],modes[2])}</div></div></div></section>`}
    function renderGuide(){const t=COPY[lang];document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title=`${t.kicker} | KOREA EASY`;document.getElementById('backLink').textContent=t.back;document.getElementById('guideMain').innerHTML=`
      <section class="hero"><div><span class="eyebrow">${t.kicker}</span><h1>${t.title}</h1><p class="lead">${t.lead}</p><p class="hero-note">${t.heroNote}</p></div><aside class="route-legend"><h2>${t.seqTitle}</h2>${t.seq.map((text,index)=>`<div class="route-line"><i>${index+1}</i><span>${text}</span></div>`).join('')}</aside></section>
      <div class="quick"><strong>${t.quickTitle}</strong>${t.quick}</div>
      <section id="taxi" aria-labelledby="terminal-title"><p class="section-kicker">${t.terminalKicker}</p><h2 class="section-title" id="terminal-title">${t.terminalTitle}</h2><p class="section-copy">${t.terminalCopy}</p><div class="terminal-tabs" role="tablist" aria-label="${t.terminalTitle}"><button class="terminal-tab" data-terminal="t1" aria-selected="${activeTerminal==='t1'}">${t.tabs[0]}</button><button class="terminal-tab" data-terminal="t2" aria-selected="${activeTerminal==='t2'}">${t.tabs[1]}</button></div>${terminalPanel('t1',t)}${terminalPanel('t2',t)}</section>
      <section aria-labelledby="gates-title"><p class="section-kicker">${t.gateKicker}</p><h2 class="section-title" id="gates-title">${t.gateTitle}</h2><p class="section-copy">${t.gateCopy}</p><div class="gate-layout"><article class="gate-card"><h3>${t.gate1}</h3><p>${t.gate1Text}</p>${gateRows(t.gateRows)}</article><article class="gate-card"><h3>${t.gate2}</h3><p>${t.gate2Text}</p>${gateRows(t.gateRows2)}</article></div></section>
      <section id="arex" class="arex"><div class="arex-image"><img src="assets/incheon-arex-rail-corridor.webp" alt="${t.imageLabel}"><span class="image-label">${t.imageLabel}</span></div><div class="arex-content"><p class="section-kicker">${t.arexKicker}</p><h2 class="section-title">${t.arexTitle}</h2><p>${t.arexText}</p><div class="arex-stops"><span>${t.tabs[1]}</span><span>${t.tabs[0]}</span><span>Gimpo Airport</span><span>Hongik Univ.</span><span>Seoul Station</span></div><p><a href="${OFFICIAL.arex}" target="_blank" rel="noopener noreferrer">${t.arexLink}</a></p></div></section>
      <section id="rental-car" class="quick" aria-labelledby="rental-title"><p class="section-kicker">${t.rentalKicker}</p><h2 class="section-title" id="rental-title">${t.rentalTitle}</h2><p class="section-copy">${t.rentalCopy}</p><div class="gate-layout"><article class="gate-card"><h3>${t.rentalT1}</h3><p>${t.rentalT1Detail}</p></article><article class="gate-card"><h3>${t.rentalT2}</h3><p>${t.rentalT2Detail}</p></article></div><p><a class="source-link" href="${OFFICIAL.rental}" target="_blank" rel="noopener noreferrer">${t.rentalLink}</a></p><div class="notice">${t.rentalNote}</div></section>
      <section id="city-buses" aria-labelledby="city-title"><p class="section-kicker">${t.cityKicker}</p><h2 class="section-title" id="city-title">${t.cityTitle}</h2><p class="section-copy">${t.cityCopy}</p><div class="city-grid">${t.cities.map((city,index)=>`<article class="city-card"><h3>${city[0]}</h3><p class="route">${city[1]}</p><p class="boarding"><strong>T1</strong> ${index===0?t.gateRows[0][1]:t.gateRows[2][1]}<br><strong>T2</strong> ${index===0?t.gateRows2[0][1]:t.gateRows2[2][1]}</p><a href="${OFFICIAL.bus}" target="_blank" rel="noopener noreferrer">${city[2]}</a></article>`).join('')}</div><div class="notice">${t.notice}</div></section>
      <section class="references"><strong>${t.refs}</strong> <a href="${OFFICIAL.taxi}" target="_blank" rel="noopener noreferrer">Taxi stands</a> · <a href="${OFFICIAL.t1}" target="_blank" rel="noopener noreferrer">T1 bus stops</a> · <a href="${OFFICIAL.t2}" target="_blank" rel="noopener noreferrer">T2 bus stops</a> · <a href="${OFFICIAL.arex}" target="_blank" rel="noopener noreferrer">AREX guide</a> · <a href="${OFFICIAL.bus}" target="_blank" rel="noopener noreferrer">Bus route search</a></section>`;
      document.querySelectorAll('.terminal-tab').forEach(button=>button.addEventListener('click',()=>{activeTerminal=button.dataset.terminal;renderGuide()}));
      document.getElementById('guideFooter').innerHTML=t.footer;
    }
    function setLanguage(next){lang=next;localStorage.setItem('incheonGuideLang',next);document.querySelectorAll('.pageLang button').forEach(button=>button.classList.toggle('on',button.dataset.lang===next));renderGuide()}
    setLanguage(lang);
  </script>
