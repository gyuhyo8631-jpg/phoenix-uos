<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOWPASS Guide | KOREA EASY</title><style>body{margin:0;font-family:Inter,Arial,'Noto Sans JP',sans-serif;background:#f6f1e8;color:#17231d}.wrap{width:min(920px,92%);margin:auto}header{padding:18px 0;border-bottom:1px solid #d8e0d7;background:#fffdf8}a{text-decoration:none;color:inherit}.brand{font-weight:950}.brand span{color:#1e6d4d}.hero{margin:28px 0;padding:34px;border-radius:26px;background:#153a29;color:white}.hero h1{font-size:clamp(2.2rem,7vw,4.7rem);margin:8px 0}.sub{line-height:1.7;color:#d9e5dd}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #d8e0d7;border-radius:20px;padding:20px}.n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#e3eee7;color:#1e6d4d;font-weight:900}.btn{display:inline-block;margin-top:12px;padding:11px 14px;border-radius:12px;background:#1e6d4d;color:white;font-weight:900}.note{margin:18px 0;padding:16px;border-radius:15px;background:#fff4d6}.langs{display:flex;gap:7px}.langs button{border:1px solid #d8e0d7;background:white;padding:8px 10px;border-radius:999px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><div class="wrap" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><a class="brand" href="./">KOREA <span>EASY</span></a><div class="langs"><button onclick="setL('ja')">日本語</button><button onclick="setL('en')">EN</button><button onclick="setL('zh')">中文</button></div></div></header>
<main class="wrap"><section class="hero"><div id="badge">韓国旅行決済ガイド</div><h1>WOWPASS</h1><p id="lead" class="sub">韓国到着後、WOWPASSカードを受け取り、チャージして使うまでを順番に確認できます。</p></section><section class="grid" id="steps"></section><div class="note" id="note"></div><a class="btn" href="https://www.wowpass.io/en/purchase" target="_blank" rel="noopener" id="official">WOWPASS公式サイトで受取方法を確認 ↗</a><p style="color:#68736c;line-height:1.7;margin:28px 0 50px" id="foot"></p></main>
<script>const C={ja:{badge:'韓国旅行決済ガイド',lead:'韓国到着後、WOWPASSカードを受け取り、チャージして使うまでを順番に確認できます。',steps:[['パスポートを準備','本人確認が必要な場合に備えてパスポートを用意します。'],['WOWPASS機器を探す','市内のホテル・コンビニ・地下鉄駅・観光地などにあるセルフサービス機器を探します。'],['カードを発行・受取','機器の画面案内に従ってカードを発行します。事前予約受取を選べる場合もあります。'],['チャージ','対応する現金・国際カード・電子決済など、表示される方法で残高を追加します。'],['アプリに登録','WOWPASSアプリにカードを登録すると残高や利用履歴を確認しやすくなります。'],['交通利用も確認','WOWPASSの交通機能を使う場合は、乗車前に交通残高・利用条件をアプリや公式案内で確認してください。']],note:'現在、WOWPASS公式サイトでは全国約446台のセルフサービス機器を案内しており、金浦国際空港も受取地域として選択できます。設置場所・価格・受取方法は変更されるため、訪問直前に公式画面で確認してください。',official:'WOWPASS公式サイトで受取方法を確認 ↗',foot:'KOREA EASYは独立した旅行ガイドです。WOWPASSの発行条件、手数料、チャージ方法、利用範囲は公式サービスの最新案内が優先されます。'},en:{badge:'KOREA PAYMENT GUIDE',lead:'Follow the steps from arrival to getting, topping up and using a WOWPASS card.',steps:[['Prepare your passport','Keep your passport ready in case identity verification is required.'],['Find a WOWPASS machine','Look for self-service machines at hotels, convenience stores, subway stations and tourist areas.'],['Issue or collect your card','Follow the on-screen instructions. Pre-booked machine collection may also be available.'],['Top up','Use one of the payment methods shown by the machine or app.'],['Register in the app','Register the card in the WOWPASS app to check balance and transaction history more easily.'],['Check transit use','Before riding, confirm the transit balance and current conditions in the app or official guide.']],note:'WOWPASS currently says about 446 self-service machines are available nationwide and Gimpo International Airport can be selected as an arrival location. Locations, pricing and collection methods can change, so check the official screen before travel.',official:'Check official WOWPASS collection options ↗',foot:'KOREA EASY is an independent visitor guide. Current WOWPASS rules, fees, top-up methods and availability are governed by the official service.'},zh:{badge:'韩国旅行支付指南',lead:'按步骤查看抵达韩国后如何领取、充值和使用WOWPASS。',steps:[['准备护照','如需身份确认，请提前准备护照。'],['寻找WOWPASS机器','可在酒店、便利店、地铁站和旅游景点等地寻找自助设备。'],['发卡或取卡','按照屏幕提示领取卡片，也可能支持提前预约后在机器取卡。'],['充值','使用机器或App当前显示的支持方式充值。'],['绑定App','在WOWPASS App中绑定卡片，更方便查看余额和交易记录。'],['确认交通功能','乘坐公共交通前，请在App或官方说明中确认交通余额和当前使用条件。']],note:'WOWPASS官网目前介绍全国约446台自助设备，并可将金浦国际机场选择为抵达地点。设备位置、价格和领取方式可能变化，请出行前查看官网最新信息。',official:'查看WOWPASS官方领取方式 ↗',foot:'KOREA EASY为独立旅行指南。WOWPASS最新发卡条件、费用、充值方式和使用范围以官方服务说明为准。'}};function setL(l){localStorage.setItem('koreaEasyLang',l);const x=C[l]||C.ja;document.documentElement.lang=l==='zh'?'zh-CN':l;badge.textContent=x.badge;lead.textContent=x.lead;steps.innerHTML=x.steps.map((s,i)=>`<article class="card"><span class="n">${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('');note.textContent=x.note;official.textContent=x.official;foot.textContent=x.foot}setL(localStorage.getItem('koreaEasyLang')||'ja');</script></body></html>
