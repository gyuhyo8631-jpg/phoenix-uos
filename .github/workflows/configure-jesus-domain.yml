name: Configure Jesus Domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: phoenix-uos.com
      RECORD_NAME: jesus.phoenix-uos.com
      CNAME_TARGET: cname.vercel-dns.com
    steps:
      - name: Require Cloudflare token
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Upsert Cloudflare DNS record
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json")

          zone_json=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&status=active")
          zone_id=$(echo "$zone_json" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::Cloudflare zone $ZONE_NAME not accessible with this token"
            exit 1
          fi

          record_json=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=CNAME&name=$RECORD_NAME")
          record_id=$(echo "$record_json" | jq -r '.result[0].id // empty')

          payload=$(jq -n             --arg type "CNAME"             --arg name "$RECORD_NAME"             --arg content "$CNAME_TARGET"             '{type:$type,name:$name,content:$content,ttl:300,proxied:false}')

          if [ -n "$record_id" ]; then
            echo "Updating existing DNS record"
            curl -fsS -X PUT "${auth[@]}"               "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id"               --data "$payload" | jq '{success,errors,result:{name:.result.name,type:.result.type,content:.result.content,proxied:.result.proxied}}'
          else
            echo "Creating DNS record"
            curl -fsS -X POST "${auth[@]}"               "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"               --data "$payload" | jq '{success,errors,result:{name:.result.name,type:.result.type,content:.result.content,proxied:.result.proxied}}'
          fi

      - name: Verify public DNS
        run: |
          for i in {1..12}; do
            answer=$(dig CNAME "$RECORD_NAME" +short | tail -1)
            echo "DNS attempt $i: ${answer:-no answer}"
            if [ -n "$answer" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::DNS record did not become visible during verification window"
          exit 1

      - name: Verify HTTPS and certificate
        shell: bash
        run: |
          set +e
          for i in {1..18}; do
            echo "HTTPS attempt $i"
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 15 "https://$RECORD_NAME/" 2>/tmp/curlerr)
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "HTTPS OK: $code"
              echo | openssl s_client -connect "$RECORD_NAME:443" -servername "$RECORD_NAME" 2>/dev/null                 | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
              exit 0
            fi
            cat /tmp/curlerr || true
            sleep 10
          done
          echo "::warning::DNS is configured but HTTPS certificate is not ready yet or Vercel has not attached the alias."
          exit 1
