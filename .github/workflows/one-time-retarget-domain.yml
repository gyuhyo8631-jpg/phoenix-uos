name: One-time retarget Korea Easy domain

on:
  push:
    paths:
      - ".github/workflows/one-time-retarget-domain.yml"

permissions:
  contents: write

jobs:
  retarget:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update canonical URLs and sitemap
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -l 'https://korea.phoenix-uos.com' -- ':!.github/**')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No old domain references remain."
            exit 0
          fi
          sed -i 's#https://korea.phoenix-uos.com#https://www.phoenix-uos.com#g' "${files[@]}"
          git add -A -- "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retarget Korea Easy canonical URLs to www domain"
          git push origin HEAD:main
