  <script>
    const TM={
      en:{back:'← Home',eyebrow:'KOREA TRANSIT CARD · 2026',title:'T-money card:<br>buy, top up, go.',lead:'A practical, station-level guide to buying and loading a T-money card for Seoul subways, buses and taxis.',quickTitle:'Quick answer',quick:'Use Korean won cash to top up a standard T-money card at a subway reload machine, station information center, or T-money sales location. Start with the amount you expect to use that day, then check the balance on screen.',whereKicker:'FIND THE MACHINE',whereTitle:'At a subway station, look for the ticket-machine zone.',whereCopy:'Stations can differ. The reliable signs are ticket-vending / reload machines, a T-money vending machine, or the station Information Center.',whereItems:[['Near the fare gates','Look around the ticket-vending or one-time ticket area.'],['Information Center','Ask staff for T-money top-up help if the machine is unclear.'],['Convenience store','Many participating stores also sell and load T-money cards.']],photoLabel:'Illustrative orientation image — machine layout varies by station',stepsKicker:'LOAD VALUE IN 4 STEPS',stepsTitle:'How to top up at a subway machine',steps:[['Find a reload or ticket machine','Use a machine marked for T-money reload, a one-time ticket issuer, or ask the Information Center.'],['Choose language if offered','Select English, 日本語 or 中文 when it is available. The button layout varies by station.'],['Place or tap your card','Follow the on-screen card-reader prompt. Keep the card still while the machine reads it.'],['Insert KRW cash and confirm','Top up in ₩1,000 units. Verify the new balance before taking your card.']],cashNote:'For the standard physical-card top-up flow, bring Korean won cash. T-money’s foreigner guide lists cash top-up from ₩1,000 to ₩90,000 per transaction, with a maximum stored balance of ₩500,000.',buyKicker:'BUY OR RELOAD',buyTitle:'What can the machine do?',buyCards:[['Buy a card','T-money cards are sold at participating convenience stores nationwide and at Seoul subway station Information Centers on Lines 1–8. Card designs and availability vary.',['Ask whether the shop can also load the card','For youth discounts, date-of-birth registration is required at a convenience store or station Information Center.']],['Reload a card','At subway stations, official top-up options include a one-time ticket issuer, T-money vending machine, portable reload machine, or Information Center.',['Keep the receipt if the machine provides one','If the screen or language is unclear, stop and ask at the Information Center rather than repeating a charge.']]],factsKicker:'USEFUL LIMITS',factsTitle:'Before you use a kiosk',facts:[['Top-up unit','₩1,000'],['Official per-transaction range','₩1,000–₩90,000'],['Maximum T-money stored balance','₩500,000'],['If you need help','Station Information Center or T-money sales location']],official:'Open T-money foreigner guide',tipsKicker:'KOREA EASY',tipsTitle:'Small tips that prevent delays',tips:[['Keep a modest balance','Top up before late-night rides or long trips, especially when convenience stores may be closed.'],['Do not confuse the machines','A one-time ticket machine and a T-money reload machine can look different, but both may offer reload functions. Follow the T-money / reload prompt.'],['Check the final balance','Wait for the success screen before removing your card. If a transaction looks wrong, ask station staff before leaving.']],next:'Continue planning',tmoneyAirport:'Incheon Airport T1/T2 Guide',mainGuide:'Main Korea Travel Guide',footer:'© 2026 KOREA EASY · Independent visitor guide. Station machine screens, payment methods, fares and locations can change. Always follow on-site instructions and official transit information.'},
      ja:{back:'← ホーム',eyebrow:'韓国交通カード · 2026',title:'T-moneyカード：<br>買う・チャージ・出発。',lead:'ソウルの地下鉄、バス、タクシーで使うT-moneyカードを、駅で購入・チャージする実用ガイドです。',quickTitle:'すぐわかる答え',quick:'標準T-moneyカードは、地下鉄のチャージ機、駅の案内所、またはT-money販売場所で韓国ウォン現金を使ってチャージします。まずは当日使う分を入れ、画面で残高を確認してください。',whereKicker:'機械を探す',whereTitle:'地下鉄駅では、券売機エリアを探してください。',whereCopy:'駅によって配置は異なります。券売機・チャージ機、T-money自販機、駅の案内所が目印です。',whereItems:[['改札口の近く','券売機または1回用きっぷエリア付近を確認します。'],['案内所','機械がわかりにくい場合はT-moneyのチャージをスタッフに尋ねます。'],['コンビニ','多くの加盟店でもT-moneyカードの販売・チャージができます。']],photoLabel:'案内用イメージ — 機械の配置は駅により異なります',stepsKicker:'4ステップでチャージ',stepsTitle:'地下鉄の機械でチャージする方法',steps:[['チャージまたは券売機を探す','T-moneyチャージ、1回用きっぷ発券機を使うか、案内所に尋ねます。'],['表示言語を選ぶ','利用可能ならEnglish、日本語、中文を選びます。ボタン配置は駅により異なります。'],['カードを置く・タッチする','画面のカードリーダー案内に従います。読み取り中はカードを動かさないでください。'],['韓国ウォン現金を入れて確認','₩1,000単位でチャージできます。カードを取る前に新しい残高を確認します。']],cashNote:'標準的な物理カードのチャージには韓国ウォン現金を用意してください。T-moneyの外国人ガイドでは、1回あたり₩1,000～₩90,000、残高上限は₩500,000と案内されています。',buyKicker:'購入・チャージ',buyTitle:'機械でできること',buyCards:[['カードを買う','T-moneyカードは全国の加盟コンビニと、ソウル地下鉄1～8号線の駅案内所で販売されています。デザインや在庫は場所により異なります。',['その店でチャージもできるか確認','子ども・青少年運賃割引には、コンビニまたは駅案内所で生年月日の登録が必要です。']],['カードをチャージ','地下鉄駅の公式チャージ方法には、1回用きっぷ発券機、T-money自販機、携帯型チャージ機、案内所があります。',['レシートが出れば保管','画面や言語が不明なら、繰り返し操作せず案内所で確認してください。']]],factsKicker:'利用上限',factsTitle:'キオスクの前に確認',facts:[['チャージ単位','₩1,000'],['公式の1回あたり範囲','₩1,000～₩90,000'],['T-money残高上限','₩500,000'],['困ったとき','駅の案内所またはT-money販売場所']],official:'T-money外国人ガイドを開く',tipsKicker:'KOREA EASY',tipsTitle:'時間を節約する小さなコツ',tips:[['残高は少し余裕を持って','深夜の移動や長距離移動前は、コンビニが閉まる可能性も考えてチャージします。'],['機械を混同しない','1回用きっぷ機とT-moneyチャージ機は見た目が異なる場合があります。T-money / チャージ表示に従ってください。'],['最後の残高を確認','成功画面が出るまでカードを取らないでください。問題があれば駅を出る前にスタッフへ。']],next:'次の計画へ',tmoneyAirport:'仁川空港 T1/T2 ガイド',mainGuide:'韓国旅行メインガイド',footer:'© 2026 KOREA EASY · 個人旅行者向けガイド。駅の機械画面、支払い方法、運賃、場所は変更される場合があります。現地表示と公式交通情報を優先してください。'},
      zh:{back:'← 首页',eyebrow:'韩国交通卡 · 2026',title:'T-money卡：<br>购买、充值、出发。',lead:'在首尔地铁、巴士和出租车上使用T-money卡的实用指南：如何在车站购买和充值。',quickTitle:'快速答案',quick:'标准T-money卡可在地铁充值机、车站服务中心或T-money销售点用韩元现金充值。先充值当天预计使用的金额，再在屏幕上确认余额。',whereKicker:'寻找机器',whereTitle:'在地铁站内，请寻找售票机区域。',whereCopy:'不同车站的布局不同。可靠标志是售票/充值机、T-money自动售卡机或车站服务中心。',whereItems:[['闸机附近','在售票机或一次性车票区域周边寻找。'],['服务中心','如果不清楚机器操作，请向工作人员询问T-money充值。'],['便利店','许多加盟便利店也可销售和充值T-money卡。']],photoLabel:'示意导向图 — 机器布局因车站而异',stepsKicker:'4步充值',stepsTitle:'如何在地铁机器上充值',steps:[['找到充值或售票机','使用标有T-money充值的一次性车票机，或向服务中心询问。'],['选择语言（如有）','可用时选择English、日本語或中文。按钮位置因车站而异。'],['放置或感应卡片','按照屏幕上的读卡提示操作。机器读取时请保持卡片不动。'],['投入韩元现金并确认','可按₩1,000为单位充值。取卡前确认新的余额。']],cashNote:'标准实体卡的充值请准备韩元现金。T-money外国人指南列明单次可充值₩1,000至₩90,000，卡内余额上限为₩500,000。',buyKicker:'购买与充值',buyTitle:'机器可以做什么？',buyCards:[['购买卡片','T-money卡可在全国加盟便利店及首尔地铁1–8号线车站服务中心购买。卡面设计和库存因地点而异。',['询问商店是否也能充值','如需儿童或青少年票价优惠，须在便利店或车站服务中心登记出生日期。']],['充值卡片','地铁站官方充值方式包括一次性车票机、T-money自动售卡机、便携式充值机或服务中心。',['如机器提供收据请保留','若屏幕或语言不清楚，请不要反复操作，应向服务中心询问。']]],factsKicker:'实用限额',factsTitle:'使用机器前请了解',facts:[['充值单位','₩1,000'],['官方单次充值范围','₩1,000–₩90,000'],['T-money余额上限','₩500,000'],['需要帮助时','车站服务中心或T-money销售点']],official:'打开T-money外国人指南',tipsKicker:'KOREA EASY',tipsTitle:'避免耽误时间的小提示',tips:[['保留适量余额','深夜或长途出行前先充值，便利店可能已关闭。'],['不要混淆机器','一次性车票机和T-money充值机外观可能不同；请按T-money / 充值提示操作。'],['确认最终余额','看到成功页面前不要取走卡片。如有疑问，请在离站前向工作人员求助。']],next:'继续规划',tmoneyAirport:'仁川机场 T1/T2 指南',mainGuide:'韩国旅行主指南',footer:'© 2026 KOREA EASY · 独立旅行者指南。车站机器屏幕、支付方式、票价和地点可能变化。请以现场指示和官方交通信息为准。'}
    };
    let lang=localStorage.getItem('tmoneyGuideLang')||'en';
    function bullet(items){return `<ul>${items.map(item=>`<li>${item}</li>`).join('')}</ul>`}
    function card(title,copy,list){return `<div class="guideCard"><h3>${title}</h3><p>${copy}</p>${bullet(list)}</div>`}
    function render(){const t=TM[lang];document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.getElementById('app').innerHTML=`
      <header><nav class="wrap"><a class="brand" href="index.html">KOREA <span>EASY</span></a><div class="navRight"><a class="home" href="index.html">${t.back}</a><div class="langSwitch"><button data-lang="en">EN</button><button data-lang="ja">日本語</button><button data-lang="zh">中文</button></div></div></nav></header>
      <main><section class="hero wrap"><div class="eyebrow">${t.eyebrow}</div><h1>${t.title}</h1><p class="lead">${t.lead}</p><div class="quick"><div class="quickMark">✓</div><div><strong>${t.quickTitle}</strong><br>${t.quick}</div></div></section>
      <section class="section wrap"><div class="sectionHead"><div><div class="eyebrow">${t.whereKicker}</div><h2>${t.whereTitle}</h2></div><p class="sectionCopy">${t.whereCopy}</p></div><div class="visualGrid"><figure class="photoCard"><img src="/manus-storage/tmoney-subway-kiosk-wayfinding_43a13613.jpg" alt="${t.photoLabel}" loading="lazy" onerror="this.closest('figure').style.display='none'"><figcaption class="photoLabel">${t.photoLabel}</figcaption></figure><aside class="whereCard"><div class="eyebrow">SUBWAY STATION</div><h3>${t.whereTitle}</h3><p>${t.whereCopy}</p><div class="locationList">${t.whereItems.map(item=>`<div class="locationItem"><strong>${item[0]}</strong><span>${item[1]}</span></div>`).join('')}</div></aside></div></section>
      <section class="section dark"><div class="wrap"><div class="sectionHead"><div><div class="eyebrow">${t.stepsKicker}</div><h2>${t.stepsTitle}</h2></div></div><div class="steps">${t.steps.map((step,index)=>`<div class="step"><div class="stepNo">${index+1}</div><h3>${step[0]}</h3><p>${step[1]}</p></div>`).join('')}</div><div class="callout">${t.cashNote}</div></div></section>
      <section class="section wrap"><div class="sectionHead"><div><div class="eyebrow">${t.buyKicker}</div><h2>${t.buyTitle}</h2></div></div><div class="miniGrid">${t.buyCards.map(item=>card(item[0],item[1],item[2])).join('')}</div></section>
      <section class="section wrap"><div class="visualGrid"><figure class="photoCard"><img src="/manus-storage/tmoney-topup-steps_ec36480e.jpg" alt="${t.photoLabel}" loading="lazy" onerror="this.closest('figure').style.display='none'"><figcaption class="photoLabel">${t.photoLabel}</figcaption></figure><div><div class="eyebrow">${t.factsKicker}</div><h2>${t.factsTitle}</h2><table class="facts">${t.facts.map(row=>`<tr><th>${row[0]}</th><td>${row[1]}</td></tr>`).join('')}</table><a class="official" href="https://www.t-money.co.kr/ncs/pct/ugd/ReadFrgnGd.dev" target="_blank" rel="noopener noreferrer">↗ ${t.official}</a><p class="imageNote">${t.photoLabel}</p></div></div></section>
      <section class="section dark"><div class="wrap"><div class="sectionHead"><div><div class="eyebrow">${t.tipsKicker}</div><h2>${t.tipsTitle}</h2></div></div><div class="miniGrid">${t.tips.map(item=>card(item[0],item[1],[])).join('')}</div><div class="links"><a class="btn" href="incheon-airport-to-seoul.html">${t.tmoneyAirport}</a><a class="btn" href="index.html">${t.mainGuide}</a></div></div></section></main>
      <footer><div class="wrap">${t.footer}</div></footer>`;
      document.querySelectorAll('.langSwitch button').forEach(button=>{button.classList.toggle('on',button.dataset.lang===lang);button.addEventListener('click',()=>{lang=button.dataset.lang;localStorage.setItem('tmoneyGuideLang',lang);render()})});
    }render();
  </script>
</body>
</html>
