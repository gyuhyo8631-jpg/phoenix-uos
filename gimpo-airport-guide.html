<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gimpo Airport Guide | KOREA EASY</title><style>body{margin:0;font-family:Inter,Arial,'Noto Sans JP',sans-serif;background:#f4f0e7;color:#17231d}.wrap{width:min(980px,92%);margin:auto}header{padding:18px 0;background:#fff;border-bottom:1px solid #ddd}a{text-decoration:none;color:inherit}.brand{font-weight:950}.brand span{color:#1e6d4d}.hero{margin:28px 0;padding:36px;border-radius:28px;background:linear-gradient(135deg,#10271b,#24573e);color:#fff}.hero h1{font-size:clamp(2.3rem,7vw,5rem);margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid #d8e0d7;border-radius:19px;padding:19px}.card b{display:block;margin-bottom:8px}.btn{display:inline-block;padding:11px 14px;border-radius:12px;background:#1e6d4d;color:#fff;font-weight:900;margin:5px}.flow{margin:18px 0;padding:20px;border-radius:20px;background:#fff}.flow p{line-height:1.8}.langs button{border:1px solid #ddd;background:white;padding:8px 10px;border-radius:999px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap" style="display:flex;justify-content:space-between"><a class="brand" href="./">KOREA <span>EASY</span></a><div class="langs"><button onclick="setL('ja')">日本語</button> <button onclick="setL('en')">EN</button> <button onclick="setL('zh')">中文</button></div></div></header><main class="wrap"><section class="hero"><div id="badge"></div><h1>GIMPO AIRPORT</h1><p id="lead"></p></section><section class="flow"><h2 id="first"></h2><p id="flow"></p><div><a class="btn" href="wowpass-guide.html">💳 WOWPASS</a><a class="btn" href="https://www.airport.co.kr/gimpoeng/index.do" target="_blank" rel="noopener" id="official"></a></div></section><section class="grid" id="cards"></section><p id="foot" style="color:#68736c;line-height:1.7;margin:28px 0 50px"></p></main><script>const C={ja:{badge:'日本からの旅行者にも便利',lead:'金浦国際空港に到着してから、カード・通信・地下鉄・ホテルまでを一つの流れで確認。',first:'到着後のおすすめ順序',flow:'国際線到着 → 入国審査・手荷物 → SIM/eSIM・現金などを準備 → WOWPASS / 交通カードを確認 → 地下鉄・空港鉄道・バス・タクシーを選択 → ホテルへ',official:'金浦空港 公式案内 ↗',cards:[['🚇 鉄道','金浦空港駅では空港鉄道AREX、地下鉄5号線・9号線、西海線、金浦ゴールドラインに接続できます。目的地に合わせて乗り換えてください。'],['🚕 タクシー','荷物が多い場合やホテルまで直接移動したい場合に便利です。乗り場の案内表示を確認してください。'],['🚌 バス','空港周辺・ソウル市内方面のバスがあります。最新の路線・乗り場は空港公式案内で確認してください。'],['💳 WOWPASS','金浦国際空港はWOWPASS公式の受取地域として案内されています。具体的な機器・受取方法はWOWPASS公式画面で確認してください。'],['🏨 ホテルへ','ホテル名・住所を韓国語または英語でも保存しておくと、タクシーや地図検索で便利です。'],['ℹ️ 旅行情報','国際線ターミナルの案内施設や空港公式情報を利用し、当日の運行・施設変更も確認してください。']],foot:'路線、運行時間、乗り場、施設は変更される場合があります。移動当日は金浦空港と各交通機関の公式案内を確認してください。'},en:{badge:'EASY ARRIVAL FROM JAPAN & ASIA',lead:'A simple flow from Gimpo International Airport arrival to payment cards, transport and your hotel.',first:'Recommended arrival order',flow:'International arrivals → Immigration & baggage → Prepare SIM/eSIM and cash → Check WOWPASS / transit card → Choose rail, bus or taxi → Hotel',official:'Gimpo Airport official guide ↗',cards:[['🚇 Rail','Gimpo Airport Station connects AREX, Subway Lines 5 and 9, Seohae Line and Gimpo Goldline. Choose the best transfer for your destination.'],['🚕 Taxi','Useful with heavy luggage or for a direct hotel trip. Follow the official taxi-stand signs.'],['🚌 Bus','Airport and Seoul-area buses are available. Check the airport guide for current routes and stops.'],['💳 WOWPASS','Gimpo International Airport is listed by WOWPASS as an arrival location. Confirm the exact collection method on WOWPASS before travel.'],['🏨 To your hotel','Save your hotel name and address in Korean or English for taxi and map searches.'],['ℹ️ Travel information','Use terminal information services and official airport updates for same-day changes.']],foot:'Routes, operating hours, stops and facilities can change. Check official airport and transport information on your travel day.'},zh:{badge:'从日本及亚洲抵达更方便',lead:'从金浦国际机场入境到支付卡、交通和酒店，一页查看。',first:'抵达后的推荐顺序',flow:'国际线到达 → 入境检查与行李 → 准备SIM/eSIM和现金 → 确认WOWPASS/交通卡 → 选择铁路、巴士或出租车 → 前往酒店',official:'金浦机场官方指南 ↗',cards:[['🚇 铁路','金浦机场站连接AREX机场铁路、地铁5号线、9号线、西海线和金浦Goldline。'],['🚕 出租车','行李较多或希望直接前往酒店时很方便，请按机场出租车乘车点指示前往。'],['🚌 巴士','有机场及首尔方向巴士，最新路线与站点请查看机场官方指南。'],['💳 WOWPASS','WOWPASS将金浦国际机场列为抵达地点之一，具体领取方式请出行前查看官方页面。'],['🏨 前往酒店','建议保存酒店的韩文或英文名称与地址，方便打车和地图搜索。'],['ℹ️ 旅行信息','利用航站楼咨询设施和机场官方信息确认当天变化。']],foot:'路线、运营时间、乘车点及设施可能变化，出行当天请确认机场和交通运营方的官方信息。'}};function setL(l){localStorage.setItem('koreaEasyLang',l);const x=C[l]||C.ja;document.documentElement.lang=l==='zh'?'zh-CN':l;badge.textContent=x.badge;lead.textContent=x.lead;first.textContent=x.first;flow.textContent=x.flow;official.textContent=x.official;cards.innerHTML=x.cards.map(x=>`<article class="card"><b>${x[0]}</b><div>${x[1]}</div></article>`).join('');foot.textContent=x.foot}setL(localStorage.getItem('koreaEasyLang')||'ja');</script></body></html>
