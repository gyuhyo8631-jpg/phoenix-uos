  <style>
    :root {
      --ink: #14211a;
      --green: #16745a;
      --green-dark: #0d4f3d;
      --green-soft: #e9f4ef;
      --sand: #fbf7ed;
      --line: #d7e0da;
      --gold: #efc14f;
      --muted: #53635a;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--sand);
      color: var(--ink);
      font-family: Inter, Arial, "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", sans-serif;
    }

    img { max-width: 100%; }
    .wrap { width: min(1160px, 92%); margin: auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fbf7edf2;
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    nav {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand { font-weight: 950; text-decoration: none; color: var(--ink); }
    .brand span { color: var(--green); }
    .cities, .langs, .quick, .actions { display: flex; gap: 7px; flex-wrap: wrap; }

    .city, .lang, .btn, .quick a {
      border: 0;
      border-radius: 999px;
      padding: 9px 12px;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
    }

    .city, .lang { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .city.on, .lang.on { background: var(--ink); color: #fff; }

    .hero {
      margin-top: 24px;
      padding: 78px 42px 40px;
      border-radius: 28px;
      background:
        linear-gradient(90deg, #092b21e8, #092b2180),
        url('https://api.cdn.visitjeju.net/photomng/imgpath/201804/30/5e8f5920-c04b-4287-a03c-cd1291ec62ea.webp') center/cover;
      color: #fff;
    }

    .hero h1 { font-size: clamp(3rem, 8vw, 6.5rem); line-height: .9; margin: 16px 0; }
    .eyebrow, .meta { font-size: .76rem; font-weight: 950; letter-spacing: .08em; color: var(--gold); }
    .lead { max-width: 760px; line-height: 1.7; color: #e4eee9; }
    .quick { margin-top: 24px; }
    .quick a { background: #fff; color: var(--ink); }

    .sec { padding: 48px 0; }
    .sec h2 { font-size: clamp(2rem, 4vw, 3.1rem); margin: 0 0 8px; }
    .sub, .facts { color: var(--muted); line-height: 1.7; }
    .section-tools { margin-top: 14px; }

    .arrival { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 18px; }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 19px;
      box-shadow: 0 10px 28px #1836270c;
    }

    .card h3, .card h4 { margin: 8px 0; }
    .btn { display: inline-block; background: var(--green); color: #fff; margin-top: 10px; }
    .btn.secondary { background: #fff; color: var(--green-dark); border: 1px solid #b9d2c7; }
    .tmoney-step-link { display: inline-block; margin-top: 12px; padding: 9px 12px; border-radius: 10px; background: #c83f34; color: #fff; text-decoration: none; font-size: .78rem; font-weight: 950; box-shadow: 0 7px 16px #8f211c24; }

    .photo { padding: 0; overflow: hidden; }
    .photo > img { width: 100%; height: 220px; object-fit: cover; display: block; background: #e9eee9; }
    .photo .body { padding: 18px; }

    .transport-card { border-left: 5px solid var(--green); }
    .bus-number {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: .79rem;
      font-weight: 950;
      letter-spacing: .03em;
    }

    .route-box {
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 14px;
      background: var(--green-soft);
      border: 1px solid #c9ded4;
      color: #234c3d;
      font-size: .88rem;
      line-height: 1.55;
    }

    .route-box strong { display: block; color: var(--green-dark); margin-bottom: 4px; }
    .source { display: inline-block; margin-top: 10px; color: #748078; font-size: .72rem; text-decoration: none; }
    .source:hover { text-decoration: underline; }
    footer { padding: 34px 0; border-top: 1px solid var(--line); color: #68746d; }

    @media (max-width: 800px) {
      .arrival { grid-template-columns: 1fr 1fr; }
      .grid { grid-template-columns: 1fr 1fr; }
      .langs { width: 100%; justify-content: flex-end; }
    }

    @media (max-width: 520px) {
      .hero { padding: 50px 22px 30px; }
      .arrival, .grid { grid-template-columns: 1fr; }
      .photo > img { height: 210px; }
    }
  </style>

    let lang = localStorage.getItem('jejuEasyLang') || 'en';
    if (!T[lang]) lang = 'en';

    function render() {
      const t = T[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
      document.getElementById('title').innerHTML = t.title;
      document.getElementById('lead').textContent = t.lead;

      document.querySelectorAll('[data-t]').forEach(element => {
        const key = element.dataset.t;
        if (t[key]) element.textContent = t[key];
      });

      document.querySelectorAll('.lang').forEach(button => {
        button.classList.toggle('on', button.dataset.lang === lang);
      });

      document.getElementById('arrivalGrid').innerHTML = ARRIVAL[lang].map((item, index) => `
        <article class="card">
          <div class="meta">0${index + 1}</div>
          <h4>${item[0]} ${item[1]}</h4>
          <div class="facts">${item[2]}</div>
          ${index === 1 ? `<a class="tmoney-step-link" href="tmoney-guide-foreigners.html">${t.tmoneyGuide}</a>` : ''}
        </article>
      `).join('');

      document.getElementById('transportGrid').innerHTML = TRANSPORT.map(item => `
        <article class="card transport-card">
          <span class="bus-number">${item.bus}</span>
          <h3>${item.name}</h3>
          <div class="facts">${item.ko}</div>
          <div class="route-box"><strong>${t.route}</strong>${item.route[lang]}</div>
          <a class="btn" target="_blank" rel="noopener" href="${mapUrl(item.name)}">${t.dir}</a>
        </article>
      `).join('');

      document.getElementById('foodGrid').innerHTML = FOODS.map(item => `
        <article class="card photo">
          <img src="${item.image}" alt="${item.name}" loading="lazy">
          <div class="body">
            <div class="meta">JEJU FOOD</div>
            <h3>${item.name}</h3>
            <div class="facts">${item.ko}</div>
            <div class="actions">
              <a class="btn" target="_blank" rel="noopener" href="${mapUrl(item.ko)}">${t.dir}</a>
            </div>
            <a class="source" href="${item.sourceUrl}" target="_blank" rel="noopener">${t.photoSource}: ${item.sourceLabel}</a>
          </div>
        </article>
      `).join('');

      document.getElementById('photoGrid').innerHTML = SPOTS.map(item => `
        <article class="card photo">
          <img src="${item.image}" alt="${item.name}" loading="lazy">
          <div class="body">
            <div class="meta">${t.best}: ${item.best}</div>
            <h3>${item.name}</h3>
