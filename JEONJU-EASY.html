    .city, .lang, .btn, .quick a {

      padding: 9px 12px;

    .quick { margin-top: 24px; }

    .sec { padding: 48px 0; }
    .sec h2 { font-size: clamp(2rem, 4vw, 3.1rem); margin: 0 0 8px; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 18px; }

      padding: 19px;

    if (!T[lang]) lang = 'en';

    function render() {
      const t = T[lang];
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
      document.getElementById('title').innerHTML = t.title;
      document.getElementById('lead').textContent = t.lead;
      document.querySelectorAll('[data-t]').forEach(element => {
        const key = element.dataset.t;
        if (t[key]) element.textContent = t[key];
      });
      document.querySelectorAll('.lang').forEach(button => button.classList.toggle('on', button.dataset.lang === lang));

      document.getElementById('arrivalGrid').innerHTML = ARRIVAL[lang].map((item, index) => `
        <article class="card">
          <div class="meta">0${index + 1}</div>
          <h4>${item[0]} ${item[1]}</h4>
          <div class="facts">${item[2]}</div>
          ${index === 1 ? `<a class="tmoney-step-link" href="tmoney-guide-foreigners.html">${t.tmoneyGuide}</a>` : ''}
        </article>
      `).join('');

      document.getElementById('transportGrid').innerHTML = TRANSPORT.map(item => `
        <article class="card transport-card">
          <span class="bus-number">${item.bus}</span>
          <h3>${item.name}</h3>
          <div class="facts">${item.ko}</div>
          <div class="route-box"><strong>${t.route}</strong>${item.route[lang]}</div>
          <div class="actions"><a class="btn" target="_blank" rel="noopener" href="${mapUrl(item.ko)}">${t.dir}</a></div>
          <a class="source" target="_blank" rel="noopener" href="${item.source}">${t.routeSource}: Jeonju official</a>
        </article>
      `).join('');

      document.getElementById('foodGrid').innerHTML = FOODS.map(item => `
        <article class="card photo">

            <h3>${item.name}</h3>
            <div class="facts">${item.ko}</div>
            <div class="actions"><a class="btn" target="_blank" rel="noopener" href="${mapUrl(item.ko)}">${t.dir}</a></div>

          </div>
        </article>
      `).join('');

      document.getElementById('photoGrid').innerHTML = SPOTS.map(item => `
