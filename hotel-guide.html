<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Compare Korea hotel prices for Seoul, Busan, Jeonju, Gangneung, Gyeongju and Jeju with the same dates and guest details.">
  <title>Korea Hotel Price Comparison | KOREA EASY</title>
  <style>
    :root{--bg:#f4f0e7;--paper:#fffdf8;--ink:#17231d;--muted:#66736b;--green:#1e6d4d;--green2:#155b3e;--line:#d7dfd7;--blue:#2563a9;--red:#b94339;--gold:#b98516;--shadow:0 16px 45px rgba(39,62,49,.10)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans KR","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#faf7f0,#f4f0e7 420px);color:var(--ink)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.wrap{width:min(1080px,92%);margin:auto}
    header{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:950;letter-spacing:.02em}.brand span{color:var(--green)}.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.lang{border:1px solid var(--line);background:white;padding:8px 11px;border-radius:999px;font-weight:850;cursor:pointer;color:#45534b}.lang.on{background:var(--ink);border-color:var(--ink);color:white}
    main{padding:26px 0 64px}.intro{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:18px}.eyebrow{display:inline-flex;padding:7px 10px;border-radius:999px;background:#e2efe7;color:var(--green2);font-size:.78rem;font-weight:950;letter-spacing:.05em}.intro h1{margin:10px 0 6px;font-size:clamp(2rem,5vw,3.8rem);letter-spacing:-.045em;line-height:1.05}.intro p{margin:0;color:var(--muted);line-height:1.65;max-width:720px}.home{display:inline-flex;white-space:nowrap;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-weight:900}
    .searchbox{background:var(--paper);border:1px solid #cdd8cf;border-radius:26px;padding:22px;box-shadow:var(--shadow)}.fields{display:grid;grid-template-columns:1.35fr 1fr 1fr .75fr .75fr;gap:12px;align-items:end}.field label{display:block;margin:0 0 7px;font-size:.84rem;font-weight:900}.field select,.field input{width:100%;height:50px;padding:0 13px;border:1px solid #cbd5cd;border-radius:13px;background:white;color:var(--ink);outline:none}.field select:focus,.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,109,77,.13)}.searchbtn{height:52px;width:100%;margin-top:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#1f7754,#155b3e);color:white;font-weight:950;cursor:pointer;box-shadow:0 9px 20px rgba(30,109,77,.22)}.searchbtn:hover{filter:brightness(1.05);transform:translateY(-1px)}
    .summary{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:24px 0 13px}.summary h2{margin:0;font-size:1.35rem}.summary p{margin:4px 0 0;color:var(--muted);font-size:.92rem}.status{padding:7px 10px;background:#e7f2eb;color:var(--green2);border-radius:999px;font-size:.78rem;font-weight:900}
    .providers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.provider{display:flex;flex-direction:column;min-height:214px;padding:19px;border-radius:20px;background:white;border:1px solid var(--line);box-shadow:0 9px 25px rgba(39,62,49,.06)}.provider.google{border-top:5px solid #4285f4}.provider.booking{border-top:5px solid #003b95}.provider.agoda{border-top:5px solid #e5383b}.provider.expedia{border-top:5px solid #f3b61f}.provider h3{margin:4px 0 7px}.provider p{margin:0;color:var(--muted);line-height:1.55;font-size:.9rem;flex:1}.provider a{display:flex;align-items:center;justify-content:center;margin-top:16px;min-height:45px;border-radius:12px;color:white;font-weight:950}.google a{background:#3579d5}.booking a{background:#003b95}.agoda a{background:#d92f33}.expedia a{background:#17366f}.provider a:hover{filter:brightness(1.08)}
    .notice{margin-top:14px;padding:14px 16px;border:1px solid #e4d092;background:#fff7d8;border-radius:15px;color:#6b5317;line-height:1.6;font-size:.88rem}.guideTitle{margin:42px 0 14px}.guideTitle h2{margin:0 0 5px;font-size:1.8rem}.guideTitle p{margin:0;color:var(--muted)}.guide{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:rgba(255,253,248,.86);border:1px solid var(--line);border-radius:18px;padding:18px}.card strong{display:block;margin-bottom:7px}.card p{margin:0;color:var(--muted);line-height:1.6;font-size:.9rem}.footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);line-height:1.65;font-size:.82rem}
    @media(max-width:900px){.fields{grid-template-columns:repeat(2,1fr)}.field.city{grid-column:1/-1}.providers{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.nav{align-items:flex-start;padding:13px 0}.langs{max-width:240px}.intro{align-items:flex-start;flex-direction:column}.home{display:none}.searchbox{padding:16px;border-radius:20px}.fields{grid-template-columns:1fr}.field.city{grid-column:auto}.providers,.guide{grid-template-columns:1fr}.summary{align-items:flex-start;flex-direction:column}.provider{min-height:188px}}
  </style>
</head>
<body>
  <header><div class="wrap nav"><a class="brand" href="./">KOREA <span>EASY</span></a><div class="langs" aria-label="Language"><button class="lang" data-lang="ko">한국어</button><button class="lang" data-lang="en">EN</button><button class="lang" data-lang="ja">日本語</button><button class="lang" data-lang="zh">中文</button></div></div></header>
  <main class="wrap">
    <section class="intro"><div><span class="eyebrow" id="badge"></span><h1 id="title"></h1><p id="lead"></p></div><a class="home" href="./" id="homeLink"></a></section>
    <section class="searchbox" aria-labelledby="title">
      <form id="hotelForm">
        <div class="fields">
          <div class="field city"><label for="city" id="cityLabel"></label><select id="city"></select></div>
          <div class="field"><label for="checkin" id="checkinLabel"></label><input id="checkin" type="date" required></div>
          <div class="field"><label for="checkout" id="checkoutLabel"></label><input id="checkout" type="date" required></div>
          <div class="field"><label for="adults" id="adultsLabel"></label><select id="adults"></select></div>
          <div class="field"><label for="rooms" id="roomsLabel"></label><select id="rooms"></select></div>
        </div>
        <button class="searchbtn" type="submit" id="searchBtn"></button>
      </form>
    </section>
    <section aria-live="polite">
      <div class="summary"><div><h2 id="resultTitle"></h2><p id="resultSummary"></p></div><span class="status" id="status"></span></div>
      <div class="providers">
        <article class="provider google"><h3>Google Hotels</h3><p id="googleText"></p><a id="googleLink" target="_blank" rel="noopener noreferrer"></a></article>
        <article class="provider booking"><h3>Booking.com</h3><p id="bookingText"></p><a id="bookingLink" target="_blank" rel="noopener noreferrer"></a></article>
        <article class="provider agoda"><h3>Agoda</h3><p id="agodaText"></p><a id="agodaLink" target="_blank" rel="noopener noreferrer"></a></article>
        <article class="provider expedia"><h3>Expedia</h3><p id="expediaText"></p><a id="expediaLink" target="_blank" rel="noopener noreferrer"></a></article>
      </div>
      <div class="notice" id="notice"></div>
    </section>
    <section><div class="guideTitle"><h2 id="guideTitle"></h2><p id="guideLead"></p></div><div class="guide" id="guide"></div></section>
    <footer class="footer" id="footer"></footer>
  </main>
  <script>
    const cities={
      seoul:{ko:'서울',en:'Seoul',ja:'ソウル',zh:'首尔',search:'Seoul, South Korea'},
      busan:{ko:'부산',en:'Busan',ja:'釜山',zh:'釜山',search:'Busan, South Korea'},
      jeonju:{ko:'전주',en:'Jeonju',ja:'全州',zh:'全州',search:'Jeonju, South Korea'},
      gangneung:{ko:'강릉',en:'Gangneung',ja:'江陵',zh:'江陵',search:'Gangneung, South Korea'},
      gyeongju:{ko:'경주',en:'Gyeongju',ja:'慶州',zh:'庆州',search:'Gyeongju, South Korea'},
      jeju:{ko:'제주',en:'Jeju',ja:'済州',zh:'济州',search:'Jeju, South Korea'}
    };
    const T={
      ko:{badge:'한국 호텔 가격 비교',title:'호텔 가격 비교 검색',lead:'도시·숙박 날짜·인원을 한 번 입력하고 여러 예약 사이트의 실제 판매 가격을 비교하세요.',home:'← 메인으로',city:'지역',checkin:'체크인',checkout:'체크아웃',adults:'성인',rooms:'객실',search:'선택 조건으로 가격 비교',result:'예약 사이트별 검색',ready:'검색 준비 완료',open:'가격 확인하기 ↗',summary:(c,n,a,r)=>`${c} · ${n}박 · 성인 ${a}명 · 객실 ${r}개`,provider:['여러 예약 사이트의 가격을 한 화면에서 비교하기 좋습니다.','무료 취소·조식 포함 등 예약 조건을 자세히 확인할 수 있습니다.','한국 및 아시아 지역 숙소와 할인 상품을 함께 확인하기 좋습니다.','항공·숙박 묶음 상품과 호텔 가격을 함께 살펴볼 수 있습니다.'],notice:'같은 호텔도 세금·봉사료·환불 조건·조식 포함 여부에 따라 최종 금액이 다를 수 있습니다. 결제 전에 반드시 총액과 취소 조건을 확인하세요.',guideTitle:'예약 전에 확인하세요',guideLead:'가격만 보지 말고 위치와 조건까지 함께 비교하면 실패를 줄일 수 있습니다.',guide:[['총 결제금액','첫 화면의 1박 가격보다 세금과 수수료가 포함된 최종 결제금액을 확인하세요.'],['무료 취소 기한','무료 취소가 가능한 마지막 날짜와 한국 현지시간 기준을 확인하세요.'],['역·관광지 거리','지도에서 실제 도보 거리와 늦은 시간 대중교통 이용 가능 여부를 확인하세요.'],['여권 영문 이름','예약자 이름은 가능하면 여권의 영문 이름과 동일하게 입력하세요.'],['늦은 체크인','밤늦게 도착하면 프런트 운영시간과 셀프 체크인 방법을 미리 확인하세요.'],['현장 결제 조건','보증금, 도시세, 카드 가능 여부와 현금 결제 조건은 숙소마다 다릅니다.']],footer:'KOREA EASY는 호텔 가격을 직접 판매하지 않습니다. 각 예약 사이트에서 표시되는 최신 가격과 예약 조건을 최종 기준으로 확인하세요.'},
      en:{badge:'KOREA HOTEL COMPARISON',title:'Compare hotel prices',lead:'Enter your city, dates and guests once, then compare live offers across multiple booking sites.',home:'← Home',city:'Destination',checkin:'Check-in',checkout:'Check-out',adults:'Adults',rooms:'Rooms',search:'Compare prices with these details',result:'Search each booking site',ready:'Ready to compare',open:'Check prices ↗',summary:(c,n,a,r)=>`${c} · ${n} night${n>1?'s':''} · ${a} adult${a>1?'s':''} · ${r} room${r>1?'s':''}`,provider:['Useful for comparing offers from multiple booking sites in one view.','Compare cancellation, breakfast and room conditions in detail.','Useful for Korea and Asia hotel offers and promotions.','Compare hotel rates and flight + stay packages.'],notice:'The final total can differ because of taxes, service fees, cancellation terms and breakfast. Check the full payment total and cancellation policy before booking.',guideTitle:'Check before booking',guideLead:'Compare location and booking conditions as well as price.',guide:[['Final total','Check the final amount including taxes and fees, not only the nightly headline price.'],['Free cancellation','Check the cancellation deadline and which local time zone applies.'],['Real travel distance','Use the map to confirm walking distance and late-night public transport.'],['Passport name','Use the same English name shown on the guest passport whenever possible.'],['Late check-in','Confirm reception hours or self check-in instructions for late arrival.'],['Pay-at-property terms','Deposits, local fees, accepted cards and cash rules vary by property.']],footer:'KOREA EASY does not sell hotel rooms. The latest price and conditions shown by each booking provider are the final reference.'},
      ja:{badge:'韓国ホテル料金比較',title:'ホテル料金を比較',lead:'都市・宿泊日・人数を一度入力し、複数の予約サイトで実際の販売料金を比較できます。',home:'← ホーム',city:'地域',checkin:'チェックイン',checkout:'チェックアウト',adults:'大人',rooms:'客室',search:'この条件で料金を比較',result:'予約サイト別に検索',ready:'比較準備完了',open:'料金を確認 ↗',summary:(c,n,a,r)=>`${c} · ${n}泊 · 大人${a}名 · ${r}室`,provider:['複数の予約サイトの料金をまとめて比較するのに便利です。','無料キャンセルや朝食などの予約条件を詳しく確認できます。','韓国・アジアの宿泊施設や割引プランを探すのに便利です。','ホテル料金と航空券＋宿泊プランを比較できます。'],notice:'同じホテルでも税金・サービス料・返金条件・朝食の有無により最終金額が異なります。決済前に合計金額とキャンセル条件を確認してください。',guideTitle:'予約前に確認',guideLead:'料金だけでなく、場所と予約条件も比較しましょう。',guide:[['最終支払額','1泊料金だけでなく、税金・手数料を含む最終金額を確認してください。'],['無料キャンセル','無料キャンセル期限と適用される現地時間を確認してください。'],['駅・観光地までの距離','地図で実際の徒歩距離と深夜の交通手段を確認してください。'],['パスポート名','予約者名はできるだけパスポートの英文名と同じにしてください。'],['深夜チェックイン','フロント営業時間やセルフチェックイン方法を事前確認してください。'],['現地払い条件','保証金、現地税、カード・現金の条件は施設ごとに異なります。']],footer:'KOREA EASYはホテルを直接販売しません。各予約サイトに表示される最新料金と条件を最終基準として確認してください。'},
      zh:{badge:'韩国酒店价格比较',title:'比较酒店价格',lead:'输入一次城市、日期和人数，即可前往多个预订网站比较实际销售价格。',home:'← 返回首页',city:'地区',checkin:'入住',checkout:'退房',adults:'成人',rooms:'客房',search:'按所选条件比较价格',result:'分别搜索预订网站',ready:'可以开始比较',open:'查看价格 ↗',summary:(c,n,a,r)=>`${c} · ${n}晚 · 成人${a}人 · ${r}间`,provider:['适合在一个页面比较多个预订网站的报价。','可详细比较免费取消、早餐和房型条件。','适合查看韩国及亚洲酒店和促销方案。','可同时比较酒店价格及机票＋住宿套餐。'],notice:'同一家酒店的最终金额可能因税费、服务费、退款条件和早餐而不同。付款前请确认总价和取消政策。',guideTitle:'预订前请确认',guideLead:'除了价格，也要比较位置和预订条件。',guide:[['最终总价','不要只看每晚价格，请确认包含税费后的最终付款金额。'],['免费取消期限','确认免费取消的最后日期及适用的当地时间。'],['实际距离','通过地图确认步行距离及深夜公共交通情况。'],['护照英文姓名','预订姓名尽量与护照上的英文姓名保持一致。'],['深夜入住','提前确认前台营业时间或自助入住方式。'],['到店付款条件','押金、当地税、银行卡及现金规则因酒店而异。']],footer:'KOREA EASY不直接销售酒店。请以各预订网站显示的最新价格和预订条件为准。'}
    };
    const el=id=>document.getElementById(id);let lang='ko';
    const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    function initDates(){const a=new Date(),b=new Date();a.setDate(a.getDate()+1);b.setDate(b.getDate()+2);el('checkin').min=iso(new Date());el('checkout').min=iso(a);el('checkin').value=iso(a);el('checkout').value=iso(b)}
    function dayDiff(){const a=new Date(el('checkin').value+'T12:00:00'),b=new Date(el('checkout').value+'T12:00:00');return Math.max(1,Math.round((b-a)/86400000))}
    function setOptions(){el('adults').innerHTML=[1,2,3,4,5,6].map(n=>`<option value="${n}" ${n===2?'selected':''}>${n}</option>`).join('');el('rooms').innerHTML=[1,2,3,4].map(n=>`<option value="${n}">${n}</option>`).join('')}
    function renderLinks(){const key=el('city').value,c=cities[key],ci=el('checkin').value,co=el('checkout').value,a=el('adults').value,r=el('rooms').value,q=c.search,n=dayDiff();el('resultSummary').textContent=T[lang].summary(c[lang],n,a,r);el('googleLink').href=`https://www.google.com/travel/search?q=${encodeURIComponent(q+' hotels')}&checkin=${ci}&checkout=${co}`;el('bookingLink').href=`https://www.booking.com/searchresults.html?ss=${encodeURIComponent(q)}&checkin=${ci}&checkout=${co}&group_adults=${a}&no_rooms=${r}&group_children=0`;el('agodaLink').href=`https://www.agoda.com/search?textToSearch=${encodeURIComponent(q)}&checkIn=${ci}&checkOut=${co}&rooms=${r}&adults=${a}&children=0`;el('expediaLink').href=`https://www.expedia.com/Hotel-Search?destination=${encodeURIComponent(q)}&startDate=${ci}&endDate=${co}&adults=${a}&rooms=${r}`}
    function setLang(next){lang=T[next]?next:'ko';localStorage.setItem('koreaEasyHotelLang',lang);document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));const x=T[lang];['badge','title','lead'].forEach(id=>el(id).textContent=x[id]);el('homeLink').textContent=x.home;el('cityLabel').textContent=x.city;el('checkinLabel').textContent=x.checkin;el('checkoutLabel').textContent=x.checkout;el('adultsLabel').textContent=x.adults;el('roomsLabel').textContent=x.rooms;el('searchBtn').textContent=x.search;el('resultTitle').textContent=x.result;el('status').textContent=x.ready;['google','booking','agoda','expedia'].forEach((p,i)=>{el(p+'Text').textContent=x.provider[i];el(p+'Link').textContent=x.open});el('notice').textContent=x.notice;el('guideTitle').textContent=x.guideTitle;el('guideLead').textContent=x.guideLead;el('guide').innerHTML=x.guide.map(g=>`<article class="card"><strong>${g[0]}</strong><p>${g[1]}</p></article>`).join('');el('footer').textContent=x.footer;const selected=el('city').value||'seoul';el('city').innerHTML=Object.entries(cities).map(([k,c])=>`<option value="${k}" ${k===selected?'selected':''}>${c[lang]}</option>`).join('');renderLinks()}
    document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));el('hotelForm').addEventListener('submit',e=>{e.preventDefault();if(el('checkout').value<=el('checkin').value){const d=new Date(el('checkin').value+'T12:00:00');d.setDate(d.getDate()+1);el('checkout').value=iso(d)}renderLinks();document.querySelector('.summary').scrollIntoView({behavior:'smooth',block:'center'})});el('checkin').addEventListener('change',()=>{const d=new Date(el('checkin').value+'T12:00:00');d.setDate(d.getDate()+1);el('checkout').min=iso(d);if(el('checkout').value<=el('checkin').value)el('checkout').value=iso(d)});['city','checkout','adults','rooms'].forEach(id=>el(id).addEventListener('change',renderLinks));setOptions();initDates();setLang(localStorage.getItem('koreaEasyHotelLang')||'ko');
  </script>
</body>
</html>
